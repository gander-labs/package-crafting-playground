name: Scorecard supply-chain security

# PRIVATE repo: Scorecard needs GitHub Advanced Security (fails with "Resource
# not accessible by integration"), so it is manual-only. Restore the original
# triggers for a public repo.
on:
  workflow_dispatch:
  # branch_protection_rule:
  # push:
  #   branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      # audit mode only (logs egress, doesn't block); switch to
      # egress-policy: block with an allowed-endpoints list once the audit
      # log shows the full set of domains this job actually calls.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || '3' }}

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
