name: Code

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Code Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PRIVATE repo: code scanning is unavailable on Free, so the SARIF upload
      # is disabled below. Restore together with the SARIF steps.
      # security-events: write # upload Trivy SARIF to the Security tab
    steps:
      # audit mode only (logs egress, doesn't block); switch to
      # egress-policy: block with an allowed-endpoints list once the audit
      # log shows the full set of domains this job actually calls.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Audit
        id: audit
        run: bun audit
      - name: Quality (Biome)
        run: bunx biome ci .
      # AGPL-3.0-only own license is intentional; anything else flags a
      # dependency whose license terms haven't been reviewed.
      - name: License check
        run: bun run license-check
      - name: Compile
        if: github.event_name != 'schedule'
        run: bun run build
      - name: Publint
        if: github.event_name != 'schedule'
        run: bun run publint
      # syft added a bun.lock cataloger in v1.46.0; force at least that so
      # this doesn't silently fall back to an empty/incomplete SBOM on an
      # older bundled syft.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          syft-version: v1.51.1
          config: .syft.yaml
      # PRIVATE repo: no Actions artifacts (account-wide 500 MB quota runs out and
      # then every run fails). Restore for a public repo.
      # - name: Upload SBOM
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: sbom
      #     path: sbom.spdx.json
      #     retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || '3' }}
      # Uploaded above first so the SBOM is still available to inspect if
      # this step fails the job. ignore-unfixed: no point failing CI on a
      # CVE with no available patch yet. SARIF output (instead of the
      # default table) so results also land in the Security tab, not just
      # the job log.
      - name: Scan SBOM for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.spdx.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # PRIVATE repo: plain table in the job log (no SARIF upload available).
          format: table
          # format: sarif
          # output: trivy-results.sarif
      # if: always() so a failed scan above still gets its findings
      # uploaded for review in the Security tab.
      # PRIVATE repo: SARIF upload fails without GitHub Code Security
      # ("Resource not accessible by integration"). Restore for a public repo.
      # - name: Upload Trivy SARIF
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      #   with:
      #     sarif_file: trivy-results.sarif
      # PRIVATE repo: no Actions artifacts (binaries ship as GitHub Release assets).
      # Restore for a public repo.
      # - name: Upload build artifacts
      #   id: artifact
      #   if: github.event_name != 'schedule'
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: package-crafting-playground-executables
      #     path: |
      #       dist/package-crafting-playground-bun
      #       dist/package-crafting-playground-node
      #       dist/package-crafting-playground-deno
      #     retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || '3' }}
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "Job status: $JOB_STATUS (no build artifact on a private repo)."
          } >> "$GITHUB_STEP_SUMMARY"
          # Public repo variant (needs the "Upload build artifacts" step above):
          # if [ "${{ steps.artifact.outcome }}" = "success" ]; then
          #   echo "- Build artifact: ${{ steps.artifact.outputs.artifact-url }}"
          # fi
